<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    MigsPod launcher icon — sibling to migs-music.
    Same visual language: white/cream figure, deep-purple accent, gloss,
    drop shadow, rounded-rect frame. Motif: bunny ears rising over a
    headphone headband + ear cups (audio, not a music note).
    Background is a COOL gradient (cyan -> blue -> violet) — the cool
    counterpart to migs-music's warm citrus, so the two read as a pair
    but stay distinguishable on a home screen.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="52%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F6FF"/>
    </linearGradient>
    <linearGradient id="innerEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <g filter="url(#ds)">
    <!-- Bunny ears (white) rising from behind the headband apex -->
    <path d="M 254 234 Q 224 180 212 120 Q 204 70 228 60 Q 252 64 262 130 Q 268 185 274 234 Z" fill="url(#figure)"/>
    <path d="M 258 234 Q 288 180 300 120 Q 308 70 284 60 Q 260 64 250 130 Q 244 185 238 234 Z" fill="url(#figure)"/>
    <!-- Inner ears (purple accent) -->
    <path d="M 250 222 Q 232 175 226 124 Q 221 90 234 86 Q 245 96 248 142 Q 251 182 254 222 Z" fill="url(#innerEar)"/>
    <path d="M 262 222 Q 280 175 286 124 Q 291 90 278 86 Q 267 96 264 142 Q 261 182 258 222 Z" fill="url(#innerEar)"/>

    <!-- Headphone headband: bold arc connecting the two cups -->
    <path d="M 136 316 Q 256 168 376 316" fill="none" stroke="url(#figure)"
          stroke-width="34" stroke-linecap="round"/>

    <!-- Left ear cup -->
    <rect x="96" y="292" width="80" height="118" rx="36" fill="url(#figure)"/>
    <rect x="116" y="316" width="40" height="74" rx="20" fill="url(#pad)"/>
    <ellipse cx="122" cy="324" rx="18" ry="24" fill="url(#gloss)"/>

    <!-- Right ear cup -->
    <rect x="336" y="292" width="80" height="118" rx="36" fill="url(#figure)"/>
    <rect x="356" y="316" width="40" height="74" rx="20" fill="url(#pad)"/>
    <ellipse cx="362" cy="324" rx="18" ry="24" fill="url(#gloss)"/>
  </g>
</svg>
